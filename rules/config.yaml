- ruleID: httpclient4-to-httpclient5-00230
  description: Connect timeout moved from RequestConfig to ConnectionConfig in 5.x
  category: mandatory
  effort: 5
  labels:
    - konveyor.io/source=httpclient4
    - konveyor.io/source=httpcomponents-client
    - konveyor.io/target=httpclient5
    - konveyor.io/target=httpcomponents-client
    - konveyor.io/generated-by=ai-rule-gen
  message: 'In HttpClient 5.x, `setConnectTimeout` has moved from `RequestConfig` to `ConnectionConfig`. Use `ConnectionConfig.custom().setConnectTimeout(Timeout.ofSeconds(30))` and set it on the connection manager via `setDefaultConnectionConfig()`. Note: timeout values now use the `Timeout` class instead of raw integers.'
  links:
    - url: https://hc.apache.org/httpcomponents-client-5.6.x/migration-guide/migration-to-classic.html
      title: Migration Documentation
  when:
    java.referenced:
        pattern: setConnectTimeout
        location: METHOD_CALL
- ruleID: httpclient4-to-httpclient5-00240
  description: Socket timeout moved from RequestConfig to ConnectionConfig in 5.x
  category: mandatory
  effort: 5
  labels:
    - konveyor.io/source=httpclient4
    - konveyor.io/source=httpcomponents-client
    - konveyor.io/target=httpclient5
    - konveyor.io/target=httpcomponents-client
    - konveyor.io/generated-by=ai-rule-gen
  message: 'In HttpClient 5.x, `setSocketTimeout` has moved from `RequestConfig` to `ConnectionConfig`. Use `ConnectionConfig.custom().setSocketTimeout(Timeout.ofMinutes(1))` and set it on the connection manager via `setDefaultConnectionConfig()`. Note: timeout values now use the `Timeout` class instead of raw integers.'
  links:
    - url: https://hc.apache.org/httpcomponents-client-5.6.x/migration-guide/migration-to-classic.html
      title: Migration Documentation
  when:
    java.referenced:
        pattern: setSocketTimeout
        location: METHOD_CALL
- ruleID: httpclient4-to-httpclient5-00260
  description: Default socket config moved from HttpClientBuilder to connection manager
  category: mandatory
  effort: 3
  labels:
    - konveyor.io/source=httpclient4
    - konveyor.io/source=httpcomponents-client
    - konveyor.io/target=httpclient5
    - konveyor.io/target=httpcomponents-client
    - konveyor.io/generated-by=ai-rule-gen
  message: In HttpClient 5.x, `setDefaultSocketConfig` has moved from the `HttpClients.custom()` builder to the connection manager builder. Use `PoolingHttpClientConnectionManagerBuilder.create().setDefaultSocketConfig(socketConfig)` or `BasicHttpClientConnectionManager.setSocketConfig(socketConfig)` instead.
  links:
    - url: https://hc.apache.org/httpcomponents-client-5.6.x/migration-guide/migration-to-classic.html
      title: Migration Documentation
  when:
    java.referenced:
        pattern: org.apache.http.impl.client.HttpClientBuilder
        location: TYPE
