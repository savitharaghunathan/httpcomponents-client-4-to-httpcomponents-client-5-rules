- ruleID: httpclient4-to-httpclient5-00020
  description: HttpClient 4.x should be migrated to HttpClient 5.x
  category: mandatory
  effort: 7
  labels:
    - konveyor.io/source=httpclient4
    - konveyor.io/source=httpcomponents-client
    - konveyor.io/target=httpclient5
    - konveyor.io/target=httpcomponents-client
    - konveyor.io/generated-by=ai-rule-gen
  message: 'Migrate from Apache HttpClient 4.x (`org.apache.httpcomponents:httpclient`) to HttpClient 5.x (`org.apache.hc.client5:httpclient5`). HttpClient 5.x can co-locate with 4.x on the same classpath due to versioned package namespace and Maven module coordinates. Major changes include: new package namespace (`org.apache.hc.*`), SSL/TLS configuration redesign, `Timeout`/`TimeValue` classes for timeouts, and removal of status line from responses.'
  links:
    - url: https://hc.apache.org/httpcomponents-client-5.6.x/migration-guide
      title: Migration Documentation
  when:
    java.dependency:
        name: org.apache.httpcomponents.httpclient
        upperbound: "5.0"
- ruleID: httpclient4-to-httpclient5-00030
  description: HttpCore 4.x should be migrated to HttpCore 5.x
  category: mandatory
  effort: 7
  labels:
    - konveyor.io/source=httpclient4
    - konveyor.io/source=httpcomponents-client
    - konveyor.io/target=httpclient5
    - konveyor.io/target=httpcomponents-client
    - konveyor.io/generated-by=ai-rule-gen
  message: Migrate from Apache HttpCore 4.x (`org.apache.httpcomponents:httpcore`) to HttpCore 5.x (`org.apache.hc.core5:httpcore5`). The package namespace changes from `org.apache.http` to `org.apache.hc.core5.http`.
  links:
    - url: https://hc.apache.org/httpcomponents-client-5.6.x/migration-guide
      title: Migration Documentation
  when:
    java.dependency:
        name: org.apache.httpcomponents.httpcore
        upperbound: "5.0"
