- ruleID: httpclient4-to-httpclient5-00090
  description: HttpClient 4.x artifact replaced by httpclient5 in HttpClient 5.x
  category: mandatory
  effort: 3
  labels:
    - konveyor.io/source=httpclient4
    - konveyor.io/target=httpclient5
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    Replace the HttpClient 4.x Maven dependency `org.apache.httpcomponents:httpclient` with the HttpClient 5.x dependency `org.apache.httpcomponents.client5:httpclient5`. HttpClient 5.x can be co-located with earlier versions on the same classpath due to versioned package namespace and Maven module coordinates.

    ## Before
    ```xml
    <dependency>
        <groupId>org.apache.httpcomponents</groupId>
        <artifactId>httpclient</artifactId>
        <version>4.5.14</version>
    </dependency>
    ```

    ## After
    ```xml
    <dependency>
        <groupId>org.apache.httpcomponents.client5</groupId>
        <artifactId>httpclient5</artifactId>
        <version>5.4</version>
    </dependency>
    ```
  links:
    - url: https://hc.apache.org/httpcomponents-client-5.4.x/migration-guide/migration-to-classic.html
      title: Migration Documentation
  when:
    java.dependency:
        name: org.apache.httpcomponents.httpclient
        lowerbound: 0.0.0
