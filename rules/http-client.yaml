- ruleID: httpclient4-to-httpclient5-00050
  description: SSLConnectionSocketFactory replaced by ClientTlsStrategyBuilder in HttpClient 5.x
  category: mandatory
  effort: 7
  labels:
    - konveyor.io/source=httpclient4
    - konveyor.io/source=httpcomponents-client
    - konveyor.io/target=httpclient5
    - konveyor.io/target=httpcomponents-client
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    Replace `SSLConnectionSocketFactory` with `ClientTlsStrategyBuilder`. In HttpClient 5.x, SSL/TLS configuration uses a fundamentally different API based on TLS strategies instead of socket factories.

    ## Before
    ```java
    import org.apache.http.conn.ssl.SSLConnectionSocketFactory;
    SSLConnectionSocketFactory sslsf = new SSLConnectionSocketFactory(
        SSLContexts.createSystemDefault(),
        new String[]{"TLSv1.2"}, null,
        SSLConnectionSocketFactory.getDefaultHostnameVerifier());
    ```

    ## After
    ```java
    import org.apache.hc.client5.http.ssl.ClientTlsStrategyBuilder;
    PoolingHttpClientConnectionManager cm = PoolingHttpClientConnectionManagerBuilder.create()
        .setTlsSocketStrategy(ClientTlsStrategyBuilder.create()
            .setSslContext(SSLContexts.createSystemDefault())
            .setTlsVersions(TLS.V_1_3)
            .buildClassic())
        .build();
    ```
  links:
    - url: https://hc.apache.org/httpcomponents-client-5.6.x/migration-guide/migration-to-classic.html
      title: Migration Documentation
  when:
    java.referenced:
        pattern: org.apache.http.conn.ssl.SSLConnectionSocketFactory
        location: IMPORT
- ruleID: httpclient4-to-httpclient5-00060
  description: ManagedHttpClientConnection cast pattern replaced by HttpCoreContext.getSSLSession()
  category: mandatory
  effort: 3
  labels:
    - konveyor.io/source=httpclient4
    - konveyor.io/source=httpcomponents-client
    - konveyor.io/target=httpclient5
    - konveyor.io/target=httpcomponents-client
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    Replace the `ManagedHttpClientConnection` cast pattern for SSL session access with the simplified `HttpCoreContext.getSSLSession()` method in HttpClient 5.x.

    ## Before
    ```java
    ((ManagedHttpClientConnection) context.getAttribute(
        HttpCoreContext.HTTP_CONNECTION)).getSSLSession();
    ```

    ## After
    ```java
    HttpCoreContext.getSSLSession();
    ```
  links:
    - url: https://hc.apache.org/httpcomponents-client-5.6.x/migration-guide/migration-to-classic.html
      title: Migration Documentation
  when:
    java.referenced:
        pattern: org.apache.http.conn.ManagedHttpClientConnection
        location: IMPORT
- ruleID: httpclient4-to-httpclient5-00070
  description: HttpResponse with entity access should use ClassicHttpResponse in HttpClient 5.x
  category: mandatory
  effort: 3
  labels:
    - konveyor.io/source=httpclient4
    - konveyor.io/source=httpcomponents-client
    - konveyor.io/target=httpclient5
    - konveyor.io/target=httpcomponents-client
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    In HttpClient 5.x, `HttpResponse` (now in `org.apache.hc.core5.http`) no longer has `getEntity()`. For classic (blocking) API usage, use `ClassicHttpResponse` which extends `HttpResponse` and provides entity access via `getEntity()`.

    ## Before
    ```java
    import org.apache.http.HttpResponse;
    HttpResponse response = client.execute(request);
    HttpEntity entity = response.getEntity();
    ```

    ## After
    ```java
    import org.apache.hc.core5.http.ClassicHttpResponse;
    // ClassicHttpResponse is returned by CloseableHttpClient.execute()
    ClassicHttpResponse response = client.execute(request);
    HttpEntity entity = response.getEntity();
    ```
  links:
    - url: https://hc.apache.org/httpcomponents-client-5.6.x/migration-guide/migration-to-classic.html
      title: Migration Documentation
  when:
    java.referenced:
        pattern: org.apache.http.HttpResponse
        location: IMPORT
- ruleID: httpclient4-to-httpclient5-00080
