    import org.apache.http.client.methods.HttpRequestBase;

    // After
    import org.apache.hc.client5.http.classic.methods.HttpUriRequestBase;
    ```
  links:
    - url: https://hc.apache.org/httpcomponents-client-5.6.x/migration-guide/migration-to-classic.html
      title: Migration Documentation
  when:
    java.referenced:
        pattern: org.apache.http.client.methods.HttpRequestBase
        location: IMPORT
- ruleID: httpclient-4-to-httpclient-5-00120
  description: HttpResponse replaced by ClassicHttpResponse in HttpClient 5.x classic APIs. The new ClassicHttpResponse interface is used for classic (blocking) HTTP responses.
  category: mandatory
  effort: 3
  labels:
    - konveyor.io/source=httpclient-4
    - konveyor.io/target=httpclient-5
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    The `HttpResponse` type from `org.apache.http` has been replaced by `ClassicHttpResponse` in HttpClient 5.x classic APIs.

    ```java
    // Before
    import org.apache.http.HttpResponse;
    HttpResponse response = client.execute(request);

    // After
    import org.apache.hc.client5.http.classic.ClassicHttpResponse;
    // or use the response handler pattern:
    client.execute(httpPost, response -> { ... });
    ```
  links:
    - url: https://hc.apache.org/httpcomponents-client-5.6.x/migration-guide/migration-to-classic.html
      title: Migration Documentation
  when:
    java.referenced:
        pattern: org.apache.http.HttpResponse
        location: IMPORT
- ruleID: httpclient-4-to-httpclient-5-00130
  description: Casting HttpContext attribute to ManagedHttpClientConnection for SSL session access is replaced by HttpCoreContext.getSSLSession() in HttpClient 5.x.
  category: mandatory
  effort: 5
  labels:
    - konveyor.io/source=httpclient-4
    - konveyor.io/target=httpclient-5
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    The pattern of casting an `HttpContext` attribute to `ManagedHttpClientConnection` to obtain an SSL session has been replaced in HttpClient 5.x. Use `HttpCoreContext.getSSLSession()` directly.

    ```java
    // Before
    ((ManagedHttpClientConnection) context.getAttribute(
        HttpCoreContext.HTTP_CONNECTION)).getSSLSession()

    // After
    HttpCoreContext.getSSLSession()
    ```
  links:
    - url: https://hc.apache.org/httpcomponents-client-5.6.x/migration-guide/migration-to-classic.html
      title: Migration Documentation
  when:
    java.referenced:
        pattern: org.apache.http.conn.ManagedHttpClientConnection
        location: IMPORT
- ruleID: httpclient-4-to-httpclient-5-00140
  description: HttpMessage.getAllHeaders() renamed to MessageHeaders.getHeaders() in HttpClient 5.x.
  category: mandatory
  effort: 1
  labels:
    - konveyor.io/source=httpclient-4
    - konveyor.io/target=httpclient-5
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    The method `HttpMessage.getAllHeaders()` has been renamed to `MessageHeaders.getHeaders()` in HttpClient 5.x.

    ```java
    // Before
    Header[] headers = response.getAllHeaders();

    // After
    Header[] headers = response.getHeaders();
    ```
  links:
    - url: https://hc.apache.org/httpcomponents-client-5.6.x/migration-guide/migration-to-classic.html
      title: Migration Documentation
  when:
