- ruleID: httpclient4-to-httpclient5-00140
  description: getRequestLine() removed in HttpClient 5.x; use new RequestLine(request)
  category: mandatory
  effort: 3
  labels:
    - konveyor.io/source=httpclient4
    - konveyor.io/source=httpcomponents-client
    - konveyor.io/target=httpclient5
    - konveyor.io/target=httpcomponents-client
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    Replace `request.getRequestLine()` with `new RequestLine(request)`. In HttpClient 5.x, the `getRequestLine()` method was removed from `HttpRequest`. Use the `RequestLine` wrapper class instead.

    ## Before
    ```java
    RequestLine requestLine = request.getRequestLine();
    ```

    ## After
    ```java
    RequestLine requestLine = new RequestLine(request);
    ```
  links:
    - url: https://hc.apache.org/httpcomponents-client-5.6.x/migration-guide/migration-to-classic.html
      title: Migration Documentation
  when:
    java.referenced:
