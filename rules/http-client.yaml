    - konveyor.io/target=httpclient5
    - konveyor.io/target=httpcomponents-client
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    Replace `closeIdleConnections()` with `closeIdle()`. In HttpClient 5.x, the method was renamed and moved to the `ConnPoolControl` interface.

    ## Before
    ```java
    connectionManager.closeIdleConnections(30, TimeUnit.SECONDS);
