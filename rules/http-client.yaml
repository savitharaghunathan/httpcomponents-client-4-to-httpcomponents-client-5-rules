        location: METHOD_CALL
- ruleID: httpclient4-to-httpclient5-00150
  description: getStatusLine() removed in HttpClient 5.x; use getCode() or new StatusLine(response)
  category: mandatory
  effort: 5
  labels:
    - konveyor.io/source=httpclient4
    - konveyor.io/source=httpcomponents-client
    - konveyor.io/target=httpclient5
    - konveyor.io/target=httpcomponents-client
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    HTTP response messages in HttpClient 5.x no longer have a status line. Replace `response.getStatusLine().getStatusCode()` with `response.getCode()`. If you need the full status line representation, use `new StatusLine(response)`.

    ## Before
    ```java
    int code = response.getStatusLine().getStatusCode();
    String status = response.getStatusLine().toString();
    ```

    ## After
    ```java
    int code = response.getCode();
    String status = new StatusLine(response).toString();
    ```
  links:
    - url: https://hc.apache.org/httpcomponents-client-5.6.x/migration-guide/migration-to-classic.html
      title: Migration Documentation
  when:
    java.referenced:
        pattern: org.apache.http.HttpResponse.getStatusLine
        location: METHOD_CALL
- ruleID: httpclient4-to-httpclient5-00160
  description: HTTP_TARGET_HOST constant replaced by HttpClientContext.getHttpRoute().getTargetHost()
  category: mandatory
  effort: 3
  labels:
    - konveyor.io/source=httpclient4
    - konveyor.io/source=httpcomponents-client
    - konveyor.io/target=httpclient5
    - konveyor.io/target=httpcomponents-client
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    Replace `HttpContext.getAttribute(HttpCoreContext.HTTP_TARGET_HOST)` with `HttpClientContext.getHttpRoute().getTargetHost()`. In HttpClient 5.x, target host access is done through the HTTP route API instead of context attributes.

    ## Before
    ```java
    HttpHost target = (HttpHost) context.getAttribute(
        HttpCoreContext.HTTP_TARGET_HOST);
    ```

    ## After
    ```java
    HttpHost target = clientContext.getHttpRoute().getTargetHost();
    ```
  links:
    - url: https://hc.apache.org/httpcomponents-client-5.6.x/migration-guide/migration-to-classic.html
      title: Migration Documentation
  when:
    builtin.filecontent:
        pattern: HttpCoreContext\.HTTP_TARGET_HOST
        filePattern: .*\.java
- ruleID: httpclient4-to-httpclient5-00170
  description: HTTP_CONNECTION constant access pattern replaced by direct API methods
  category: mandatory
  effort: 3
  labels:
    - konveyor.io/source=httpclient4
    - konveyor.io/source=httpcomponents-client
    - konveyor.io/target=httpclient5
    - konveyor.io/target=httpcomponents-client
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    Replace the `HttpCoreContext.HTTP_CONNECTION` attribute access pattern with direct API calls. In HttpClient 5.x, connection details like SSL sessions are accessible through `HttpCoreContext.getSSLSession()` without casting to `ManagedHttpClientConnection`.

    ## Before
    ```java
    ManagedHttpClientConnection conn = (ManagedHttpClientConnection)
        context.getAttribute(HttpCoreContext.HTTP_CONNECTION);
    SSLSession session = conn.getSSLSession();
    ```

    ## After
    ```java
    SSLSession session = context.getSSLSession();
    ```
  links:
    - url: https://hc.apache.org/httpcomponents-client-5.6.x/migration-guide/migration-to-classic.html
      title: Migration Documentation
  when:
    builtin.filecontent:
        pattern: HttpCoreContext\.HTTP_CONNECTION
        filePattern: .*\.java
- ruleID: httpclient4-to-httpclient5-00180
  description: URIUtils.normalizeSyntax() no longer public in HttpClient 5.x; use URIBuilder.optimize()
  category: mandatory
  effort: 5
  labels:
    - konveyor.io/source=httpclient4
    - konveyor.io/source=httpcomponents-client
    - konveyor.io/target=httpclient5
    - konveyor.io/target=httpcomponents-client
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    Replace `URIUtils.normalizeSyntax()` with `URIBuilder.optimize()`. In HttpClient 5.x, `URIUtils.normalizeSyntax` is no longer public. The `URIBuilder` in httpcomponents-core 5.x has a new `optimize()` method (previously `normalizeSyntax()`, now deprecated and renamed). Note that the 5.x implementation provides more thorough RFC 3986 support, including percent-encoding all components.

    ## Before
    ```java
    import org.apache.http.client.utils.URIUtils;
    URI normalized = URIUtils.normalizeSyntax(uri);
    ```

    ## After
    ```java
    import org.apache.hc.core5.net.URIBuilder;
    URI optimized = new URIBuilder(uri).optimize().build();
    ```
  links:
    - url: https://hc.apache.org/httpcomponents-client-5.6.x/migration-guide/migration-to-classic.html
      title: Migration Documentation
  when:
    java.referenced:
        pattern: org.apache.http.client.utils.URIUtils.normalizeSyntax
        location: METHOD_CALL
- ruleID: httpclient4-to-httpclient5-00190
  description: RequestConfig normalizeUri property removed in HttpClient 5.x
  category: mandatory
  effort: 3
  labels:
    - konveyor.io/source=httpclient4
    - konveyor.io/source=httpcomponents-client
    - konveyor.io/target=httpclient5
    - konveyor.io/target=httpcomponents-client
    - konveyor.io/generated-by=ai-rule-gen
  message: The `normalizeUri` property has been removed from `RequestConfig` in HttpClient 5.x. If you need URI normalization, use `URIBuilder.optimize()` directly. Note that 5.x URI normalization provides more thorough RFC 3986 support than 4.x.
  links:
    - url: https://hc.apache.org/httpcomponents-client-5.6.x/migration-guide/migration-to-classic.html
      title: Migration Documentation
  when:
    builtin.filecontent:
        pattern: setNormalizeUri|normalizeUri
        filePattern: .*\.java
- ruleID: httpclient4-to-httpclient5-00200
  description: setConnectTimeout() and setSocketTimeout() moved from RequestConfig to ConnectionConfig
  category: mandatory
  effort: 5
  labels:
    - konveyor.io/source=httpclient4
    - konveyor.io/source=httpcomponents-client
    - konveyor.io/target=httpclient5
    - konveyor.io/target=httpcomponents-client
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    In HttpClient 5.x, `setConnectTimeout()` and `setSocketTimeout()` moved from `RequestConfig` to `ConnectionConfig`. Configure these timeouts on the connection manager's `ConnectionConfig` instead of `RequestConfig`, and use the `Timeout` class instead of raw milliseconds.

    ## Before
    ```java
    RequestConfig config = RequestConfig.custom()
        .setConnectTimeout(60000)
        .setSocketTimeout(60000)
        .build();
    ```

    ## After
    ```java
    ConnectionConfig connectionConfig = ConnectionConfig.custom()
        .setConnectTimeout(Timeout.ofMinutes(1))
        .setSocketTimeout(Timeout.ofMinutes(1))
        .build();
    PoolingHttpClientConnectionManager cm = PoolingHttpClientConnectionManagerBuilder.create()
        .setDefaultConnectionConfig(connectionConfig)
        .build();
    ```
  links:
    - url: https://hc.apache.org/httpcomponents-client-5.6.x/migration-guide/migration-to-classic.html
      title: Migration Documentation
  when:
    builtin.filecontent:
        pattern: \.set(Connect|Socket)Timeout\(
        filePattern: .*\.java
- ruleID: httpclient4-to-httpclient5-00240
  description: setConnectionTimeToLive() moved from HttpClientBuilder to ConnectionConfig.setTimeToLive()
  category: mandatory
  effort: 5
  labels:
    - konveyor.io/source=httpclient4
    - konveyor.io/source=httpcomponents-client
    - konveyor.io/target=httpclient5
    - konveyor.io/target=httpcomponents-client
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    In HttpClient 5.x, `setConnectionTimeToLive()` was removed from `HttpClientBuilder`. Connection time-to-live is now configured via `ConnectionConfig.custom().setTimeToLive()` on the connection manager. Use `TimeValue` instead of raw `TimeUnit` parameters.

    ## Before
    ```java
    CloseableHttpClient client = HttpClients.custom()
        .setConnectionTimeToLive(1, TimeUnit.MINUTES)
        .build();
    ```

    ## After
    ```java
    PoolingHttpClientConnectionManager cm = PoolingHttpClientConnectionManagerBuilder.create()
        .setDefaultConnectionConfig(ConnectionConfig.custom()
            .setTimeToLive(TimeValue.ofMinutes(1))
            .build())
        .build();
    CloseableHttpClient client = HttpClients.custom()
        .setConnectionManager(cm)
        .build();
    ```
  links:
    - url: https://hc.apache.org/httpcomponents-client-5.6.x/migration-guide/migration-to-classic.html
      title: Migration Documentation
  when:
    java.referenced:
        pattern: setConnectionTimeToLive
        location: METHOD_CALL
