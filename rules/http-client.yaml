        location: IMPORT
- ruleID: httpclient4-to-httpclient5-00130
  description: HttpResponse renamed to ClassicHttpResponse in HttpClient 5.x
  category: mandatory
  effort: 3
  labels:
    - konveyor.io/source=httpclient4
    - konveyor.io/target=httpclient5
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    Replace `org.apache.http.HttpResponse` with `org.apache.hc.core5.http.message.StatusLine` for status line access, or use `ClassicHttpResponse` for entity handling. In HttpClient 5.x, `HttpResponse` no longer has `getStatusLine()` or `getEntity()` directly — use `response.getCode()` for status and `ClassicHttpResponse.getEntity()` for entity access.

    ## Before
    ```java
    import org.apache.http.HttpResponse;
    int code = response.getStatusLine().getStatusCode();
    HttpEntity entity = response.getEntity();
    ```

    ## After
    ```java
    import org.apache.hc.core5.http.ClassicHttpResponse;
    int code = response.getCode();
    HttpEntity entity = response.getEntity();
    ```
  links:
    - url: https://hc.apache.org/httpcomponents-client-5.4.x/migration-guide/migration-to-classic.html
      title: Migration Documentation
  when:
    java.referenced:
        pattern: org.apache.http.HttpResponse
        location: IMPORT
- ruleID: httpclient4-to-httpclient5-00140
  description: HttpPost constructor replaced by ClassicRequestBuilder in HttpClient 5.x
  category: mandatory
  effort: 5
  labels:
    - konveyor.io/source=httpclient4
    - konveyor.io/target=httpclient5
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    Replace `new HttpPost(url)` with `ClassicRequestBuilder.post(url)...build()`. In HttpClient 5.x, request construction uses a builder pattern via `ClassicRequestBuilder`.

    ## Before
    ```java
    HttpPost httpPost = new HttpPost("https://httpbin.org/post");
    httpPost.setEntity(requestEntity);
    ```

    ## After
    ```java
    ClassicHttpRequest httpPost = ClassicRequestBuilder.post("https://httpbin.org/post")
        .setEntity(HttpEntities.create(outstream -> {
            objectMapper.writeValue(outstream, requestData);
        }, ContentType.APPLICATION_JSON))
        .build();
    ```
  links:
    - url: https://hc.apache.org/httpcomponents-client-5.4.x/migration-guide/migration-to-classic.html
      title: Migration Documentation
  when:
    java.referenced:
        pattern: org.apache.http.client.methods.HttpPost
        location: CONSTRUCTOR_CALL
- ruleID: httpclient4-to-httpclient5-00150
  description: setRetryHandler() renamed to setRetryStrategy() in HttpClient 5.x
  category: mandatory
  effort: 5
  labels:
    - konveyor.io/source=httpclient4
    - konveyor.io/target=httpclient5
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    Replace `setRetryHandler(HttpRequestRetryHandler)` with `setRetryStrategy(HttpRequestRetryStrategy)`. The new strategy interface provides more flexible retry control.

    ## Before
    ```java
    HttpClients.custom().setRetryHandler(myRetryHandler);
    ```

    ## After
    ```java
    HttpClients.custom().setRetryStrategy(myRetryStrategy);
    ```
  links:
    - url: https://hc.apache.org/httpcomponents-client-5.4.x/migration-guide/migration-to-classic.html
      title: Migration Documentation
  when:
    java.referenced:
        pattern: setRetryHandler
        location: METHOD_CALL
