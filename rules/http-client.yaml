- ruleID: httpclient4-to-httpclient5-00210
  description: setSSLSocketFactory() renamed to setTlsSocketStrategy() in HttpClient 5.x
  category: mandatory
  effort: 5
  labels:
    - konveyor.io/source=httpclient4
    - konveyor.io/target=httpclient5
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    Replace `setSSLSocketFactory(SSLConnectionSocketFactory)` with `setTlsSocketStrategy(ClientTlsStrategy)` on the connection manager builder. The SSL/TLS configuration API was redesigned in HttpClient 5.x.

    ## Before
    ```java
    HttpClients.custom()
        .setSSLSocketFactory(new SSLConnectionSocketFactory(
            SSLContexts.createSystemDefault(),
            new String[]{"TLSv1.2"}, null,
            SSLConnectionSocketFactory.getDefaultHostnameVerifier()))
    ```

    ## After
    ```java
    PoolingHttpClientConnectionManagerBuilder.create()
        .setTlsSocketStrategy(ClientTlsStrategyBuilder.create()
            .setSslContext(SSLContexts.createSystemDefault())
            .setTlsVersions(TLS.V_1_3)
            .build())
    ```
  links:
    - url: https://hc.apache.org/httpcomponents-client-5.4.x/migration-guide/migration-to-classic.html
      title: Migration Documentation
  when:
    java.referenced:
        pattern: setSSLSocketFactory
        location: METHOD_CALL
- ruleID: httpclient4-to-httpclient5-00220
  description: HTTP_TARGET_HOST constant replaced by getHttpRoute().getTargetHost() in HttpClient 5.x
  category: mandatory
  effort: 5
  labels:
    - konveyor.io/source=httpclient4
    - konveyor.io/target=httpclient5
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    Replace `HttpContext.getAttribute(HttpCoreContext.HTTP_TARGET_HOST)` with `HttpClientContext.getHttpRoute().getTargetHost()`. In HttpClient 5.x, target host information is accessed through the HTTP route.

    ## Before
    ```java
    HttpHost target = (HttpHost) context.getAttribute(HttpCoreContext.HTTP_TARGET_HOST);
    ```

    ## After
    ```java
    HttpHost target = clientContext.getHttpRoute().getTargetHost();
    ```
  links:
    - url: https://hc.apache.org/httpcomponents-client-5.4.x/migration-guide/migration-to-classic.html
      title: Migration Documentation
  when:
    builtin.filecontent:
        pattern: HttpCoreContext\.HTTP_TARGET_HOST
        filePattern: .*\.java
- ruleID: httpclient4-to-httpclient5-00230
