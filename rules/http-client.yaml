- ruleID: httpclient-4-to-httpclient-5-00010
  description: org.apache.http package namespace replaced by org.apache.hc.httpclient5 and org.apache.hc.core5 in HttpClient 5.x
  category: mandatory
  effort: 5
  labels:
    - konveyor.io/source=httpclient-4
    - konveyor.io/target=httpclient-5
    - konveyor.io/generated-by=ai-rule-gen
  message: Apache HttpClient 5.x uses a versioned package namespace. Remove old `org.apache.http` imports and re-import HttpClient classes from `org.apache.hc.httpclient5` (client classes) or `org.apache.hc.core5` (core classes like `HttpEntity`) package namespace. Most old interfaces and classes should resolve automatically after re-importing.
  links:
    - url: https://hc.apache.org/httpcomponents-client-5.4.x/migration-guide/preparation.html
      title: Migration Documentation
  when:
    java.referenced:
        pattern: org.apache.http*
        location: PACKAGE
- ruleID: httpclient-4-to-httpclient-5-00020
  description: SSLConnectionSocketFactory replaced by ClientTlsStrategyBuilder in HttpClient 5.x
  category: mandatory
  effort: 5
  labels:
    - konveyor.io/source=httpclient-4
    - konveyor.io/target=httpclient-5
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    In HttpClient 5.x, `SSLConnectionSocketFactory` has been replaced by `ClientTlsStrategyBuilder`. Use `ClientTlsStrategyBuilder.create().setSslContext(...).setTlsVersions(TLS.V_1_3).buildClassic()` to create TLS socket strategies.

    ```java
    // Before (4.x)
    new SSLConnectionSocketFactory(
        SSLContexts.createSystemDefault(),
        new String[] { "TLSv1.2" },
        null,
        SSLConnectionSocketFactory.getDefaultHostnameVerifier())

    // After (5.x)
    ClientTlsStrategyBuilder.create()
        .setSslContext(SSLContexts.createSystemDefault())
        .setTlsVersions(TLS.V_1_3)
        .buildClassic()
    ```
  links:
    - url: https://hc.apache.org/httpcomponents-client-5.4.x/migration-guide/preparation.html
      title: Migration Documentation
  when:
    java.referenced:
        pattern: org.apache.http.conn.ssl.SSLConnectionSocketFactory
        location: IMPORT
- ruleID: httpclient-4-to-httpclient-5-00030
  description: setConnectionTimeToLive() renamed to setTimeToLive() and moved to ConnectionConfig in HttpClient 5.x
  category: mandatory
  effort: 5
  labels:
    - konveyor.io/source=httpclient-4
    - konveyor.io/target=httpclient-5
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    In HttpClient 5.x, `setConnectionTimeToLive(long, TimeUnit)` on `HttpClientBuilder` has been replaced by `ConnectionConfig.custom().setTimeToLive(TimeValue)`. Note that as of HttpClient 5.0, a zero TTL is treated as an instruction that connections are not meant to be re-used. Use a negative value for unlimited/infinite TTL.

    ```java
    // Before (4.x)
    HttpClients.custom()
        .setConnectionTimeToLive(1, TimeUnit.MINUTES)

    // After (5.x)
    ConnectionConfig.custom()
        .setTimeToLive(TimeValue.ofMinutes(10))
        .build()
    ```
  links:
    - url: https://hc.apache.org/httpcomponents-client-5.4.x/migration-guide/preparation.html
      title: Migration Documentation
  when:
    java.referenced:
        pattern: setConnectionTimeToLive
        location: METHOD_CALL
- ruleID: httpclient-4-to-httpclient-5-00040
  description: HttpPost replaced by ClassicRequestBuilder.post() in HttpClient 5.x classic APIs
  category: mandatory
  effort: 5
  labels:
    - konveyor.io/source=httpclient-4
    - konveyor.io/target=httpclient-5
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    In HttpClient 5.x classic APIs, `HttpPost` (and other method-specific request classes like `HttpGet`, `HttpPut`) are replaced by `ClassicRequestBuilder`. Use `ClassicRequestBuilder.post(uri).setEntity(...).build()` to create request objects. The result type is `ClassicHttpRequest`.

    ```java
    // Before (4.x)
    HttpPost httpPost = new HttpPost("https://httpbin.org/post");
    httpPost.setEntity(requestEntity);

    // After (5.x)
    ClassicHttpRequest httpPost = ClassicRequestBuilder.post("https://httpbin.org/post")
        .setEntity(HttpEntities.create(outstream -> { ... }, ContentType.APPLICATION_JSON))
        .build();
    ```
  links:
    - url: https://hc.apache.org/httpcomponents-client-5.4.x/migration-guide/preparation.html
      title: Migration Documentation
  when:
    java.referenced:
        pattern: org.apache.http.client.methods.HttpPost
        location: IMPORT
- ruleID: httpclient-4-to-httpclient-5-00050
  description: EntityTemplate replaced by HttpEntities.create() factory method in HttpClient 5.x
  category: mandatory
  effort: 5
  labels:
    - konveyor.io/source=httpclient-4
    - konveyor.io/target=httpclient-5
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    In HttpClient 5.x, `EntityTemplate` with manual `setContentType()` is replaced by `HttpEntities.create()` which accepts a content producer and `ContentType` directly.

    ```java
    // Before (4.x)
    EntityTemplate requestEntity = new EntityTemplate(outstream -> {
        objectMapper.writeValue(outstream, requestData);
        outstream.flush();
    });
    requestEntity.setContentType(ContentType.APPLICATION_JSON.toString());
    httpPost.setEntity(requestEntity);

    // After (5.x)
    ClassicRequestBuilder.post(url)
        .setEntity(HttpEntities.create(outstream -> {
            objectMapper.writeValue(outstream, data);
            outstream.flush();
        }, ContentType.APPLICATION_JSON))
        .build();
    ```
  links:
    - url: https://hc.apache.org/httpcomponents-client-5.4.x/migration-guide/preparation.html
      title: Migration Documentation
  when:
    java.referenced:
        pattern: org.apache.http.entity.EntityTemplate
        location: IMPORT
- ruleID: httpclient-4-to-httpclient-5-00060
  description: getStatusLine() removed in HttpClient 5.x; use getCode() for status code or new StatusLine(response) for status line
  category: mandatory
  effort: 5
  labels:
    - konveyor.io/source=httpclient-4
    - konveyor.io/target=httpclient-5
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    HTTP response messages in HttpClient 5.x no longer have a status line. `getStatusLine()` has been removed. Use `response.getCode()` to get the status code directly, or `new StatusLine(response)` if you need the full status line representation.

    ```java
    // Before (4.x)
    if (response.getStatusLine().getStatusCode() >= 300) {
        throw new ClientProtocolException(
            Objects.toString(response.getStatusLine()));
    }

    // After (5.x)
    if (response.getCode() >= 300) {
        throw new ClientProtocolException(
            new StatusLine(response).toString());
    }
    ```
  links:
    - url: https://hc.apache.org/httpcomponents-client-5.4.x/migration-guide/preparation.html
      title: Migration Documentation
  when:
    java.referenced:
        pattern: getStatusLine
        location: METHOD_CALL
- ruleID: httpclient-4-to-httpclient-5-00170
  description: setRetryHandler() renamed to setRetryStrategy() in HttpClient 5.x
  category: mandatory
  effort: 5
  labels:
    - konveyor.io/source=httpclient-4
    - konveyor.io/target=httpclient-5
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    Replace `setRetryHandler(HttpRequestRetryHandler)` with `setRetryStrategy(HttpRequestRetryStrategy)`. The new strategy interface provides more flexible retry control:

    ```java
    // Before
    HttpClients.custom().setRetryHandler(myRetryHandler);

    // After
    HttpClients.custom().setRetryStrategy(myRetryStrategy);
    ```
  links:
    - url: https://hc.apache.org/httpcomponents-client-5.4.x/migration-guide/migration-to-classic.html
      title: Migration Documentation
  when:
    java.referenced:
        pattern: setRetryHandler
        location: METHOD_CALL
- ruleID: httpclient-4-to-httpclient-5-00250
  description: CloseableHttpClient replaced by CloseableHttpAsyncClient for async APIs
  category: mandatory
  effort: 7
  labels:
    - konveyor.io/source=httpclient-4
    - konveyor.io/target=httpclient-5
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    For async migration, replace `CloseableHttpClient` with `CloseableHttpAsyncClient`. The async client requires explicit starting and uses `Future`-based execution:

    ```java
    // Before
    CloseableHttpClient client = HttpClients.custom()
        .setConnectionManager(cm)
        .build();
    client.execute(request);

    // After
    CloseableHttpAsyncClient client = HttpAsyncClients.custom()
        .setConnectionManager(cm)
        .setIOReactorConfig(IOReactorConfig.custom()
            .setSoTimeout(Timeout.ofMinutes(1))
            .build())
        .build();
    client.start();  // Must start before executing requests
    Future<?> future = client.execute(request, callback);
    ```
  links:
    - url: https://hc.apache.org/httpcomponents-client-5.4.x/migration-guide/migration-to-async-simple.html
      title: Migration Documentation
  when:
    java.referenced:
        pattern: org.apache.http.impl.client.CloseableHttpClient
        location: IMPORT
