- ruleID: httpclient4-to-httpclient5-00180
  description: addInterceptorLast() replaced by addExecInterceptorFirst() in HttpClient 5.x
  category: mandatory
  effort: 5
  labels:
    - konveyor.io/source=httpclient4
    - konveyor.io/target=httpclient5
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    Replace `addInterceptorLast(interceptor)` with `addExecInterceptorFirst(name, interceptor)` for logging interceptors. Using `addExecInterceptorFirst` ensures the interceptor runs before response decompression, so the logged payload is readable (otherwise compressed payload may be logged).

    ## Before
    ```java
    HttpClients.custom().addInterceptorLast(loggingInterceptor);
    ```

    ## After
    ```java
    HttpClients.custom().addExecInterceptorFirst("logging", loggingInterceptor);
    ```
  links:
    - url: https://hc.apache.org/httpcomponents-client-5.4.x/migration-guide/migration-to-classic.html
      title: Migration Documentation
  when:
    java.referenced:
        pattern: addInterceptorLast
        location: METHOD_CALL
- ruleID: httpclient4-to-httpclient5-00190
  description: getRequestLine() removed in HttpClient 5.x; use new RequestLine(request)
  category: mandatory
  effort: 3
  labels:
