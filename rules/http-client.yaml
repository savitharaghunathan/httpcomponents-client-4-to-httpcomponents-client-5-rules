    Replace `closeExpiredConnections()` with `closeExpired()`. The method was moved from `HttpClientConnectionManager` to the `ConnPoolControl` interface in HttpClient 5.x.

    ## Before
    ```java
    connectionManager.closeExpiredConnections();
    ```

    ## After
    ```java
    connectionManager.closeExpired();
