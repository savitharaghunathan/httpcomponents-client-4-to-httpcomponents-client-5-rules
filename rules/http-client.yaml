- ruleID: httpclient4-to-httpclient5-00010
  description: org.apache.http package namespace replaced by org.apache.hc.client5 and org.apache.hc.core5 in HttpClient 5.x
  category: mandatory
  effort: 5
  labels:
    - konveyor.io/source=httpclient4
    - konveyor.io/source=httpcomponents-client
    - konveyor.io/target=httpclient5
    - konveyor.io/target=httpcomponents-client
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    Remove old `org.apache.http` imports and re-import HttpClient classes from `org.apache.hc.client5.http` (client classes) or `org.apache.hc.core5.http` (core classes) package namespaces. HttpClient 5.x uses versioned package namespaces and can co-locate with 4.x on the same classpath.

    ## Before
    ```java
    import org.apache.http.client.HttpClient;
    import org.apache.http.HttpResponse;
    ```

    ## After
    ```java
    import org.apache.hc.client5.http.classic.HttpClient;
    import org.apache.hc.core5.http.ClassicHttpResponse;
    ```
  links:
    - url: https://hc.apache.org/httpcomponents-client-5.6.x/migration-guide/migration-to-classic.html
      title: Migration Documentation
  when:
    java.referenced:
        pattern: org.apache.http*
        location: PACKAGE
- ruleID: httpclient4-to-httpclient5-00020
  description: BasicHttpContext renamed to HttpCoreContext in HttpClient 5.x
  category: mandatory
  effort: 1
  labels:
    - konveyor.io/source=httpclient4
    - konveyor.io/source=httpcomponents-client
    - konveyor.io/target=httpclient5
    - konveyor.io/target=httpcomponents-client
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    Replace `BasicHttpContext` with `HttpCoreContext` or `HttpClientContext`. In HttpClient 5.x, `BasicHttpContext` was renamed to `HttpCoreContext`.

    ## Before
    ```java
    import org.apache.http.protocol.BasicHttpContext;
    HttpContext context = new BasicHttpContext();
    ```

    ## After
    ```java
    import org.apache.hc.core5.http.protocol.HttpCoreContext;
    HttpCoreContext context = HttpCoreContext.create();
    ```
  links:
    - url: https://hc.apache.org/httpcomponents-client-5.6.x/migration-guide/migration-to-classic.html
      title: Migration Documentation
  when:
    java.referenced:
        pattern: org.apache.http.protocol.BasicHttpContext
        location: IMPORT
- ruleID: httpclient4-to-httpclient5-00030
  description: HttpEntityEnclosingRequest replaced by HttpEntityContainer in HttpClient 5.x
  category: mandatory
  effort: 3
  labels:
    - konveyor.io/source=httpclient4
    - konveyor.io/source=httpcomponents-client
    - konveyor.io/target=httpclient5
    - konveyor.io/target=httpcomponents-client
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    Replace `HttpEntityEnclosingRequest` with `HttpEntityContainer`. In HttpClient 5.x, any HTTP method can enclose a request entity, so the dedicated `HttpEntityEnclosingRequest` interface was replaced by the more general `HttpEntityContainer` interface.

    ## Before
    ```java
    import org.apache.http.HttpEntityEnclosingRequest;
    ```

    ## After
    ```java
    import org.apache.hc.core5.http.HttpEntityContainer;
    ```
  links:
    - url: https://hc.apache.org/httpcomponents-client-5.6.x/migration-guide/migration-to-classic.html
      title: Migration Documentation
  when:
    java.referenced:
        pattern: org.apache.http.HttpEntityEnclosingRequest
        location: IMPORT
- ruleID: httpclient4-to-httpclient5-00040
  description: HttpRequestBase renamed to HttpUriRequestBase in HttpClient 5.x
