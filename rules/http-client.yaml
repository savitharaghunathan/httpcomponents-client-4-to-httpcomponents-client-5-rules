        location: METHOD_CALL
- ruleID: httpclient-4-to-httpclient-5-00150
  description: HttpRequest.getRequestLine() removed in HttpClient 5.x. Use new RequestLine(request) instead.
  category: mandatory
  effort: 3
  labels:
    - konveyor.io/source=httpclient-4
    - konveyor.io/target=httpclient-5
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    The method `HttpRequest.getRequestLine()` has been removed in HttpClient 5.x. Use `new RequestLine(request)` instead.

    ```java
    // Before
    RequestLine line = request.getRequestLine();

    // After
    RequestLine line = new RequestLine(request);
    ```
  links:
    - url: https://hc.apache.org/httpcomponents-client-5.6.x/migration-guide/migration-to-classic.html
      title: Migration Documentation
  when:
    java.referenced:
        pattern: org.apache.http.HttpRequest.getRequestLine
        location: METHOD_CALL
- ruleID: httpclient-4-to-httpclient-5-00160
  description: HttpClientBuilder.setRetryHandler() renamed to setRetryStrategy() in HttpClient 5.x. The retry handler interface has been replaced by HttpRequestRetryStrategy.
  category: mandatory
  effort: 5
  labels:
    - konveyor.io/source=httpclient-4
    - konveyor.io/target=httpclient-5
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    The method `HttpClients.custom().setRetryHandler()` has been renamed to `setRetryStrategy()` in HttpClient 5.x. The `HttpRequestRetryHandler` interface has been replaced by `HttpRequestRetryStrategy`.

    ```java
    // Before
    HttpClients.custom().setRetryHandler(myRetryHandler);

    // After
    HttpClients.custom().setRetryStrategy(myRetryStrategy);
    ```
  links:
    - url: https://hc.apache.org/httpcomponents-client-5.6.x/migration-guide/migration-to-classic.html
      title: Migration Documentation
  when:
    java.referenced:
        pattern: org.apache.http.impl.client.HttpClientBuilder.setRetryHandler
        location: METHOD_CALL
