- ruleID: httpclient4-to-httpclient5-00010
  description: org.apache.http package relocated to org.apache.hc.client5 and org.apache.hc.core5 in HttpClient 5.x
  category: mandatory
  effort: 5
  labels:
    - konveyor.io/source=httpclient4
    - konveyor.io/target=httpclient5
    - konveyor.io/generated-by=ai-rule-gen
  message: |
    Apache HttpClient 4.x classes under `org.apache.http` have been relocated to `org.apache.hc.client5` and `org.apache.hc.core5` in HttpClient 5.x. Update all imports from the old package namespace to the new one.

    ## Before
    ```java
    import org.apache.http.client.HttpClient;
    import org.apache.http.HttpResponse;
    ```

    ## After
    ```java
    import org.apache.hc.client5.http.classic.HttpClient;
    import org.apache.hc.core5.http.ClassicHttpResponse;
    ```

    ### Specific replacements

    | Old class | Replacement |
    |---|---|
    | `org.apache.http.client.ClientProtocolException` | org.apache.hc.client5.http.ClientProtocolException |
  links:
    - url: https://hc.apache.org/httpcomponents-client-5.4.x/migration-guide/preparation.html
      title: Migration Documentation
  when:
    java.referenced:
        pattern: org.apache.http
        location: PACKAGE
- ruleID: httpclient4-to-httpclient5-00020
  description: SSLConnectionSocketFactory replaced by TLS strategy builders in HttpClient 5.x
  category: mandatory
  effort: 7
  labels:
    - konveyor.io/source=httpclient4
    - konveyor.io/target=httpclient5
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    In HttpClient 5.x, `SSLConnectionSocketFactory` has been replaced by a TLS strategy-based approach. Use `ClientTlsStrategyBuilder` or the equivalent 5.x TLS configuration API instead of directly constructing `SSLConnectionSocketFactory`.

    ## Before
    ```java
    new SSLConnectionSocketFactory(
        SSLContexts.createSystemDefault(),
        new String[] { "TLSv1.2" },
        null,
        SSLConnectionSocketFactory.getDefaultHostnameVerifier())
    ```

    ## After
    ```java
    ClientTlsStrategyBuilder.create()
        .setSslContext(SSLContexts.createSystemDefault())
        .setTlsVersions(TLS.V_1_2)
        .build()
    ```
  links:
    - url: https://hc.apache.org/httpcomponents-client-5.4.x/migration-guide/preparation.html
      title: Migration Documentation
  when:
    java.referenced:
        pattern: org.apache.http.conn.ssl.SSLConnectionSocketFactory
        location: IMPORT
- ruleID: httpclient4-to-httpclient5-00030
  description: setConnectionTimeToLive() signature changed to use TimeValue in HttpClient 5.x
  category: mandatory
  effort: 3
  labels:
    - konveyor.io/source=httpclient4
    - konveyor.io/target=httpclient5
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    In HttpClient 5.x, `setConnectionTimeToLive(long, TimeUnit)` now takes a `TimeValue` parameter instead of separate long and TimeUnit arguments. Note that as of HttpClient 5.0, zero TTL is treated as an instruction that connections are not meant to be re-used (previously it was treated as infinite TTL). Use a negative value for unlimited TTL.

    ## Before
    ```java
    .setConnectionTimeToLive(1, TimeUnit.MINUTES)
    ```

    ## After
    ```java
    .setConnectionTimeToLive(TimeValue.ofMinutes(1))
    ```
  links:
    - url: https://hc.apache.org/httpcomponents-client-5.4.x/migration-guide/preparation.html
      title: Migration Documentation
  when:
    java.referenced:
        pattern: setConnectionTimeToLive
        location: METHOD_CALL
- ruleID: httpclient4-to-httpclient5-00040
  description: setConnectTimeout() moved from RequestConfig to ConnectionConfig in HttpClient 5.x
  category: mandatory
  effort: 5
  labels:
    - konveyor.io/source=httpclient4
    - konveyor.io/target=httpclient5
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    In HttpClient 5.x, `setConnectTimeout()` has moved from `RequestConfig` to `ConnectionConfig` and now takes a `Timeout` parameter instead of a raw integer (milliseconds).

    ## Before
    ```java
    RequestConfig.custom()
        .setConnectTimeout(60000)
        .build()
    ```

    ## After
    ```java
    ConnectionConfig.custom()
        .setConnectTimeout(Timeout.ofMilliseconds(60000))
        .build()
    ```
  links:
    - url: https://hc.apache.org/httpcomponents-client-5.4.x/migration-guide/preparation.html
      title: Migration Documentation
  when:
    java.referenced:
        pattern: setConnectTimeout
        location: METHOD_CALL
