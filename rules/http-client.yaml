    - konveyor.io/target=httpclient5
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    Replace `getAllHeaders()` with `getHeaders()`. The method was renamed from `HttpMessage.getAllHeaders()` to `MessageHeaders.getHeaders()` in HttpClient 5.x.

    ## Before
    ```java
    Header[] headers = response.getAllHeaders();
    ```

    ## After
    ```java
    Header[] headers = response.getHeaders();
    ```
  links:
