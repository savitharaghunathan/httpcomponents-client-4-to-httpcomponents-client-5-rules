- ruleID: httpclient4-to-httpclient5-00070
  description: HttpResponse.getStatusLine() removed in HttpClient 5.x; use getCode() instead
  category: mandatory
  effort: 3
  labels:
    - konveyor.io/source=httpclient4
    - konveyor.io/target=httpclient5
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    In HttpClient 5.x, the `StatusLine` class has been removed. Instead of calling `response.getStatusLine().getStatusCode()`, use `response.getCode()` directly. Similarly, use `response.getReasonPhrase()` instead of `response.getStatusLine().getReasonPhrase()`.

    ## Before
    ```java
    if (response.getStatusLine().getStatusCode() >= 300) {
        throw new ClientProtocolException(
            Objects.toString(response.getStatusLine()));
    }
    ```

    ## After
    ```java
    if (response.getCode() >= 300) {
        throw new ClientProtocolException(
            response.getReasonPhrase());
    }
    ```
  links:
    - url: https://hc.apache.org/httpcomponents-client-5.4.x/migration-guide/preparation.html
      title: Migration Documentation
  when:
    java.referenced:
        pattern: getStatusLine
        location: METHOD_CALL
- ruleID: httpclient4-to-httpclient5-00080
  description: EntityTemplate relocated and API changed in HttpClient 5.x
  category: mandatory
  effort: 5
  labels:
    - konveyor.io/source=httpclient4
    - konveyor.io/target=httpclient5
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    In HttpClient 5.x, `EntityTemplate` has been relocated from `org.apache.http.entity` to `org.apache.hc.core5.http.io.entity`. The API has also changed: content type is now set via the constructor rather than a separate `setContentType()` call.

    ## Before
    ```java
    import org.apache.http.entity.EntityTemplate;

    EntityTemplate requestEntity = new EntityTemplate(outstream -> {
        objectMapper.writeValue(outstream, requestData);
    });
    requestEntity.setContentType(ContentType.APPLICATION_JSON.toString());
    ```

    ## After
    ```java
    import org.apache.hc.core5.http.io.entity.EntityTemplate;

    EntityTemplate requestEntity = new EntityTemplate(-1, ContentType.APPLICATION_JSON, null, outstream -> {
        objectMapper.writeValue(outstream, requestData);
    });
    ```
  links:
    - url: https://hc.apache.org/httpcomponents-client-5.4.x/migration-guide/preparation.html
      title: Migration Documentation
  when:
    java.referenced:
        pattern: org.apache.http.entity.EntityTemplate
        location: IMPORT
- ruleID: httpclient4-to-httpclient5-00100
  description: BasicHttpContext renamed to HttpCoreContext in HttpClient 5.x
  category: mandatory
  effort: 1
  labels:
    - konveyor.io/source=httpclient4
    - konveyor.io/target=httpclient5
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    Replace `BasicHttpContext` with `HttpCoreContext` or `HttpClientContext`. In HttpClient 5.x, `BasicHttpContext` has been renamed.

    ## Before
    ```java
    HttpContext context = new BasicHttpContext();
    ```

    ## After
    ```java
    HttpCoreContext context = HttpCoreContext.create();
    // or
    HttpClientContext context = HttpClientContext.create();
    ```
  links:
    - url: https://hc.apache.org/httpcomponents-client-5.4.x/migration-guide/migration-to-classic.html
      title: Migration Documentation
  when:
    java.referenced:
        pattern: org.apache.http.protocol.BasicHttpContext
        location: IMPORT
- ruleID: httpclient4-to-httpclient5-00110
  description: HttpEntityEnclosingRequest replaced by HttpEntityContainer in HttpClient 5.x
  category: mandatory
  effort: 3
  labels:
    - konveyor.io/source=httpclient4
    - konveyor.io/target=httpclient5
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    Replace `HttpEntityEnclosingRequest` with `HttpEntityContainer`. In HttpClient 5.x, any HTTP method can enclose a request entity, so the dedicated interface was replaced.

    ## Before
    ```java
    if (request instanceof HttpEntityEnclosingRequest) {
        HttpEntity entity = ((HttpEntityEnclosingRequest) request).getEntity();
    }
    ```

    ## After
    ```java
    if (request instanceof HttpEntityContainer) {
        HttpEntity entity = ((HttpEntityContainer) request).getEntity();
    }
    ```
  links:
    - url: https://hc.apache.org/httpcomponents-client-5.4.x/migration-guide/migration-to-classic.html
      title: Migration Documentation
  when:
    java.referenced:
        pattern: org.apache.http.HttpEntityEnclosingRequest
        location: IMPORT
- ruleID: httpclient4-to-httpclient5-00120
  description: HttpRequestBase renamed to HttpUriRequestBase in HttpClient 5.x
  category: mandatory
  effort: 1
