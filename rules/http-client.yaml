- ruleID: httpclient-4-to-httpclient-5-00190
  description: HttpClientBuilder.addInterceptorLast() should be replaced with addExecInterceptorFirst() in HttpClient 5.x to avoid logging compressed payload.
  category: mandatory
  effort: 5
  labels:
    - konveyor.io/source=httpclient-4
    - konveyor.io/target=httpclient-5
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    The method `HttpClients.custom().addInterceptorLast()` for adding logging interceptors should be replaced with `addExecInterceptorFirst()` in HttpClient 5.x. Otherwise, compressed payload may be logged.

    ```java
    // Before
    HttpClients.custom().addInterceptorLast(loggingInterceptor);

    // After
    HttpClients.custom().addExecInterceptorFirst("logging", loggingInterceptor);
    ```
  links:
    - url: https://hc.apache.org/httpcomponents-client-5.6.x/migration-guide/migration-to-classic.html
      title: Migration Documentation
  when:
    java.referenced:
        pattern: org.apache.http.impl.client.HttpClientBuilder.addInterceptorLast
        location: METHOD_CALL
- ruleID: httpclient-4-to-httpclient-5-00200
  description: HttpClients.custom().setDefaultSocketConfig() moved to PoolingHttpClientConnectionManagerBuilder or BasicHttpClientConnectionManager in HttpClient 5.x.
  category: mandatory
  effort: 5
  labels:
    - konveyor.io/source=httpclient-4
    - konveyor.io/target=httpclient-5
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    The method `HttpClients.custom().setDefaultSocketConfig(...)` has been moved to the connection manager builder in HttpClient 5.x. Configure socket settings on `PoolingHttpClientConnectionManagerBuilder` or `BasicHttpClientConnectionManager` instead.

    ```java
    // Before
    HttpClients.custom().setDefaultSocketConfig(
        SocketConfig.custom().setSoTimeout(30000).build());

    // After
    PoolingHttpClientConnectionManagerBuilder.create()
        .setDefaultSocketConfig(SocketConfig.custom()
            .setSoTimeout(Timeout.ofSeconds(30))
            .build())
        .build();
    ```
  links:
    - url: https://hc.apache.org/httpcomponents-client-5.6.x/migration-guide/migration-to-classic.html
      title: Migration Documentation
  when:
    java.referenced:
        pattern: org.apache.http.impl.client.HttpClientBuilder.setDefaultSocketConfig
        location: METHOD_CALL
- ruleID: httpclient-4-to-httpclient-5-00210
  description: HttpContext.getAttribute(HttpCoreContext.HTTP_TARGET_HOST) replaced by HttpClientContext.getHttpRoute().getTargetHost() in HttpClient 5.x.
  category: mandatory
  effort: 5
  labels:
    - konveyor.io/source=httpclient-4
    - konveyor.io/target=httpclient-5
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    The pattern of accessing the target host via `HttpContext.getAttribute(HttpCoreContext.HTTP_TARGET_HOST)` has been replaced in HttpClient 5.x. Use `HttpClientContext.getHttpRoute().getTargetHost()` instead.

    ```java
    // Before
    HttpHost target = (HttpHost) context.getAttribute(
        HttpCoreContext.HTTP_TARGET_HOST);

    // After
    HttpHost target = clientContext.getHttpRoute().getTargetHost();
    ```
  links:
    - url: https://hc.apache.org/httpcomponents-client-5.6.x/migration-guide/migration-to-classic.html
      title: Migration Documentation
  when:
    builtin.filecontent:
        pattern: HttpCoreContext\.HTTP_TARGET_HOST
        filePattern: .*\.java
- ruleID: httpclient-4-to-httpclient-5-00220
  description: URIUtils.normalizeSyntax is no longer public in HttpClient 5.x. The new URIBuilder in httpcomponents-core 5.x has a public normalizeSyntax method (deprecated since 5.3, renamed to optimize) with more thorough RFC 3986 support including percent-encoding.
  category: mandatory
  effort: 5
  labels:
    - konveyor.io/source=httpclient-4
    - konveyor.io/target=httpclient-5
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    The `URIUtils.normalizeSyntax` method is no longer public in HttpClient 5.x. Use `URIBuilder.normalizeSyntax()` (or `URIBuilder.optimize()` since 5.3) from httpcomponents-core instead. Note that the 5.x implementation provides more thorough RFC 3986 support, specifically percent-encoding all components.

    ```java
    // Before
    import org.apache.http.client.utils.URIUtils;
    URI normalized = URIUtils.normalizeSyntax(uri);

    // After
    import org.apache.hc.core5.net.URIBuilder;
    URI normalized = new URIBuilder(uri).optimize().build();
    ```
  links:
    - url: https://hc.apache.org/httpcomponents-client-5.6.x/migration-guide/migration-to-classic.html
      title: Migration Documentation
  when:
    java.referenced:
        pattern: org.apache.http.client.utils.URIUtils.normalizeSyntax
        location: METHOD_CALL
- ruleID: httpclient-4-to-httpclient-5-00230
  description: The RequestConfig property normalizeUri has been removed in HttpClient 5.x. URI normalization is now handled by URIBuilder.optimize() (or the deprecated normalizeSyntax()) in httpcomponents-core 5.x.
  category: mandatory
  effort: 5
  labels:
    - konveyor.io/source=httpclient-4
    - konveyor.io/target=httpclient-5
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    The `RequestConfig` property `normalizeUri` (set via `setNormalizeUri()`) has been removed in HttpClient 5.x. URI normalization behavior has changed: the 5.x `URIBuilder` provides more thorough RFC 3986 support. Use `URIBuilder.optimize()` for explicit normalization.

    ```java
    // Before
    RequestConfig config = RequestConfig.custom()
        .setNormalizeUri(true)
        .build();

    // After
    // normalizeUri no longer exists; use URIBuilder.optimize() for explicit normalization
    URI optimized = new URIBuilder(uri).optimize().build();
    ```
  links:
    - url: https://hc.apache.org/httpcomponents-client-5.6.x/migration-guide/migration-to-classic.html
      title: Migration Documentation
  when:
    builtin.filecontent:
        pattern: setNormalizeUri
        filePattern: .*\.java
