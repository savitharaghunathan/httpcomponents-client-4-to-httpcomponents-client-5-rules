- ruleID: httpclient-4-to-httpclient-5-00080
  description: Apache HttpCore 4.x artifact org.apache.httpcomponents:httpcore has been replaced by org.apache.hc.core5:httpcore5 in HttpClient 5.x.
  category: mandatory
  effort: 1
  labels:
    - konveyor.io/source=httpclient-4
    - konveyor.io/target=httpclient-5
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    The Apache HttpCore 4.x Maven artifact `org.apache.httpcomponents:httpcore` has been replaced by `org.apache.hc.core5:httpcore5` in HttpClient 5.x. Update your dependency coordinates.

    ```xml
    <!-- Before -->
    <dependency>
        <groupId>org.apache.httpcomponents</groupId>
        <artifactId>httpcore</artifactId>
    </dependency>

    <!-- After -->
    <dependency>
        <groupId>org.apache.hc.core5</groupId>
        <artifactId>httpcore5</artifactId>
    </dependency>
    ```
  links:
    - url: https://hc.apache.org/httpcomponents-client-5.6.x/migration-guide/migration-to-classic.html
      title: Migration Documentation
  when:
    java.dependency:
        name: org.apache.httpcomponents.httpcore
        lowerbound: 0.0.0
- ruleID: httpclient-4-to-httpclient-5-00090
  description: HttpEntityEnclosingRequest interface removed in HttpClient 5.x. In HttpClient 5.x, any HTTP method can enclose a request entity. Use HttpEntityContainer interface instead.
  category: mandatory
  effort: 5
  labels:
    - konveyor.io/source=httpclient-4
    - konveyor.io/target=httpclient-5
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    The `HttpEntityEnclosingRequest` interface has been removed in HttpClient 5.x. In HttpClient 5.x, one can enclose a request entity with any HTTP method, even if it violates the semantic of the method. Replace `HttpEntityEnclosingRequest` with `HttpEntityContainer` from `org.apache.hc.core5.http`.

    ```java
    // Before
    import org.apache.http.HttpEntityEnclosingRequest;

    // After
    import org.apache.hc.core5.http.HttpEntityContainer;
    ```
  links:
    - url: https://hc.apache.org/httpcomponents-client-5.6.x/migration-guide/migration-to-classic.html
      title: Migration Documentation
  when:
    java.referenced:
        pattern: org.apache.http.HttpEntityEnclosingRequest
        location: IMPORT
- ruleID: httpclient-4-to-httpclient-5-00100
  description: BasicHttpContext replaced by HttpCoreContext or HttpClientContext in HttpClient 5.x.
  category: mandatory
  effort: 3
  labels:
    - konveyor.io/source=httpclient-4
    - konveyor.io/target=httpclient-5
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    The `BasicHttpContext` class has been replaced in HttpClient 5.x. Use `HttpCoreContext` or `HttpClientContext` instead.

    ```java
    // Before
    import org.apache.http.protocol.BasicHttpContext;
    HttpContext context = new BasicHttpContext();

    // After
    import org.apache.hc.core5.http.protocol.HttpCoreContext;
    // or
    import org.apache.hc.client5.http.protocol.HttpClientContext;
    HttpClientContext context = HttpClientContext.create();
    ```
  links:
    - url: https://hc.apache.org/httpcomponents-client-5.6.x/migration-guide/migration-to-classic.html
      title: Migration Documentation
  when:
    java.referenced:
        pattern: org.apache.http.protocol.BasicHttpContext
        location: IMPORT
- ruleID: httpclient-4-to-httpclient-5-00110
  description: HttpRequestBase renamed to HttpUriRequestBase in HttpClient 5.x.
  category: mandatory
  effort: 3
  labels:
