- ruleID: httpclient4-to-httpclient5-00100
  description: addInterceptorLast() replaced by addExecInterceptorFirst() in HttpClient 5.x
  category: mandatory
  effort: 3
  labels:
    - konveyor.io/source=httpclient4
    - konveyor.io/source=httpcomponents-client
    - konveyor.io/target=httpclient5
    - konveyor.io/target=httpcomponents-client
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    Replace `addInterceptorLast()` with `addExecInterceptorFirst()` when adding logging interceptors. In HttpClient 5.x, using `addExecInterceptorFirst` ensures uncompressed payload is logged (otherwise, compressed payload may be logged).

    ## Before
    ```java
    HttpClients.custom().addInterceptorLast(loggingInterceptor);
    ```

    ## After
    ```java
    HttpClients.custom().addExecInterceptorFirst("logging", loggingInterceptor);
    ```
  links:
    - url: https://hc.apache.org/httpcomponents-client-5.6.x/migration-guide/migration-to-classic.html
      title: Migration Documentation
  when:
    java.referenced:
        pattern: addInterceptorLast
        location: METHOD_CALL
- ruleID: httpclient4-to-httpclient5-00110
  description: setDefaultSocketConfig() moved from HttpClientBuilder to PoolingHttpClientConnectionManagerBuilder
  category: mandatory
  effort: 5
  labels:
    - konveyor.io/source=httpclient4
    - konveyor.io/source=httpcomponents-client
    - konveyor.io/target=httpclient5
    - konveyor.io/target=httpcomponents-client
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    In HttpClient 5.x, `setDefaultSocketConfig()` moved from `HttpClientBuilder` to `PoolingHttpClientConnectionManagerBuilder`. Create a connection manager with the socket config and pass it to the client builder.

    ## Before
    ```java
    HttpClients.custom()
        .setDefaultSocketConfig(SocketConfig.custom()
            .setSoTimeout(60000)
            .build())
        .build();
    ```

    ## After
    ```java
    PoolingHttpClientConnectionManager cm = PoolingHttpClientConnectionManagerBuilder.create()
        .setDefaultSocketConfig(SocketConfig.custom()
            .setSoTimeout(Timeout.ofMinutes(1))
            .build())
        .build();
    HttpClients.custom().setConnectionManager(cm).build();
    ```
  links:
    - url: https://hc.apache.org/httpcomponents-client-5.6.x/migration-guide/migration-to-classic.html
      title: Migration Documentation
  when:
    java.referenced:
        pattern: setDefaultSocketConfig
        location: METHOD_CALL
- ruleID: httpclient4-to-httpclient5-00120
  description: setRetryHandler() renamed to setRetryStrategy() in HttpClient 5.x
  category: mandatory
  effort: 5
  labels:
    - konveyor.io/source=httpclient4
    - konveyor.io/source=httpcomponents-client
    - konveyor.io/target=httpclient5
    - konveyor.io/target=httpcomponents-client
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    Replace `setRetryHandler(HttpRequestRetryHandler)` with `setRetryStrategy(HttpRequestRetryStrategy)`. In HttpClient 5.x, the retry mechanism uses `HttpRequestRetryStrategy` which provides a more flexible retry API.

    ## Before
    ```java
    HttpClients.custom().setRetryHandler(myRetryHandler);
    ```

    ## After
    ```java
    HttpClients.custom().setRetryStrategy(myRetryStrategy);
    ```
  links:
    - url: https://hc.apache.org/httpcomponents-client-5.6.x/migration-guide/migration-to-classic.html
      title: Migration Documentation
  when:
    java.referenced:
        pattern: setRetryHandler
        location: METHOD_CALL
- ruleID: httpclient4-to-httpclient5-00130
  description: getAllHeaders() renamed to getHeaders() on MessageHeaders in HttpClient 5.x
  category: mandatory
  effort: 1
