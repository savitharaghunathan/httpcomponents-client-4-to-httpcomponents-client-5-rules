    - konveyor.io/target=httpcomponents-client
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    Replace `getAllHeaders()` with `getHeaders()`. In HttpClient 5.x, the method was renamed on the `MessageHeaders` interface (which replaces `HttpMessage` for header access).

    ## Before
    ```java
    Header[] headers = response.getAllHeaders();
    ```

    ## After
    ```java
    Header[] headers = response.getHeaders();
    ```
  links:
