- ruleID: httpclient4-to-httpclient5-00060
  description: SocketConfig.setSoTimeout() replaced by ConnectionConfig.setSocketTimeout() in HttpClient 5.x
  category: mandatory
  effort: 5
  labels:
    - konveyor.io/source=httpclient4
    - konveyor.io/target=httpclient5
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    In HttpClient 5.x, `SocketConfig.custom().setSoTimeout(int)` has been replaced. Socket timeout is now configured via `ConnectionConfig.custom().setSocketTimeout(Timeout)` using the `Timeout` wrapper type.

    ## Before
    ```java
    SocketConfig.custom()
        .setSoTimeout(60000)
        .build()
    ```

    ## After
    ```java
    ConnectionConfig.custom()
        .setSocketTimeout(Timeout.ofMilliseconds(60000))
        .build()
    ```
