- ruleID: httpclient4-to-httpclient5-00170
  description: closeIdleConnections() renamed to closeIdle() in HttpClient 5.x
  category: mandatory
  effort: 1
  labels:
    - konveyor.io/source=httpclient4
    - konveyor.io/target=httpclient5
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    Replace `closeIdleConnections()` with `closeIdle()`. The method was moved from `HttpClientConnectionManager` to the `ConnPoolControl` interface in HttpClient 5.x.

    ## Before
    ```java
    connectionManager.closeIdleConnections(30, TimeUnit.SECONDS);
    ```

    ## After
    ```java
    connectionManager.closeIdle(TimeValue.ofSeconds(30));
    ```
