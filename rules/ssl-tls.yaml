- ruleID: httpcomponents-client-4-to-httpcomponents-client-5-00030
  description: SSLConnectionSocketFactory has been relocated from org.apache.http.conn.ssl to org.apache.hc.client5.http.ssl in Http...
  category: mandatory
  effort: 5
  labels:
    - konveyor.io/source=httpcomponents-client-4
    - konveyor.io/target=httpcomponents-client-5
    - konveyor.io/generated-by=ai-rule-gen
    - konveyor.io/test-result=passed
    - konveyor.io/review=unreviewed
  message: |-
    The `SSLConnectionSocketFactory` class has moved from `org.apache.http.conn.ssl` to `org.apache.hc.client5.http.ssl` in HttpClient 5.x. Consider using `HttpClientConnectionManagerBuilder` with TLS configuration for the 5.x approach.

    ```java
    // Before
    import org.apache.http.conn.ssl.SSLConnectionSocketFactory;

    // After
    import org.apache.hc.client5.http.ssl.SSLConnectionSocketFactory;
    ```
  when:
    java.referenced:
        pattern: org.apache.http.conn.ssl.SSLConnectionSocketFactory
        location: IMPORT
