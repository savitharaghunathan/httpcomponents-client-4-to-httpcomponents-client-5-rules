- ruleID: httpcomponents-client-4-to-httpcomponents-client-5-00180
  description: The getStatusLine() method has been removed in HttpClient 5.x. Use getCode() for the status code and getReasonPhrase(...
  category: mandatory
  effort: 5
  labels:
    - konveyor.io/source=httpcomponents-client-4
    - konveyor.io/target=httpcomponents-client-5
    - konveyor.io/generated-by=ai-rule-gen
    - konveyor.io/test-result=passed
    - konveyor.io/review=unreviewed
  message: |-
    The `getStatusLine()` method has been removed from `HttpResponse` in HttpClient 5.x. Use `getCode()` to get the HTTP status code and `getReasonPhrase()` to get the reason phrase.

    ```java
    // Before
    if (response.getStatusLine().getStatusCode() >= 300) {
        throw new ClientProtocolException(Objects.toString(response.getStatusLine()));
    }

    // After
    if (response.getCode() >= 300) {
        throw new ClientProtocolException(response.getReasonPhrase());
    }
    ```
  when:
    java.referenced:
        pattern: org.apache.http.HttpResponse.getStatusLine
        location: METHOD_CALL
