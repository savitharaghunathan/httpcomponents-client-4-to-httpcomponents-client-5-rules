- ruleID: httpclient-4-to-httpclient-5-00200
  description: HttpMessage.getAllHeaders() renamed to MessageHeaders.getHeaders() in HttpClient 5.x
  category: mandatory
  effort: 1
  labels:
    - konveyor.io/source=httpclient-4
    - konveyor.io/target=httpclient-5
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    Replace `getAllHeaders()` with `getHeaders()`. The method was renamed when `HttpMessage` became `MessageHeaders`:

    ```java
    // Before
    Header[] headers = response.getAllHeaders();

    // After
    Header[] headers = response.getHeaders();
    ```
  links:
    - url: https://hc.apache.org/httpcomponents-client-5.4.x/migration-guide/migration-to-classic.html
      title: Migration Documentation
  when:
    java.referenced:
        pattern: getAllHeaders
        location: METHOD_CALL
- ruleID: httpclient-4-to-httpclient-5-00230
  description: HttpResponse renamed to ClassicHttpResponse in HttpClient 5.x
  category: mandatory
  effort: 3
  labels:
    - konveyor.io/source=httpclient-4
    - konveyor.io/target=httpclient-5
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    Replace `org.apache.http.HttpResponse` with `ClassicHttpResponse`. The class was renamed and the response API simplified (no more status line — use `getCode()` directly):

    ```java
    // Before
    import org.apache.http.HttpResponse;
    HttpResponse response = client.execute(request);
    int status = response.getStatusLine().getStatusCode();

    // After
    import org.apache.hc.client5.http.impl.classic.ClassicHttpResponse;
    // or use response handler pattern:
    client.execute(request, response -> {
        int status = response.getCode();
        ...
    });
    ```
  links:
    - url: https://hc.apache.org/httpcomponents-client-5.4.x/migration-guide/migration-to-classic.html
      title: Migration Documentation
  when:
    java.referenced:
        pattern: org.apache.http.HttpResponse
        location: IMPORT
