- ruleID: httpclient-4-to-httpclient-5-00020
  description: The entire org.apache.http package namespace has been replaced. Classes must be re-imported from org.apache.hc.httpclient5 (client classes) or org.apache.hc.core5 (core HTTP classes).
  category: mandatory
  effort: 5
  labels:
    - konveyor.io/source=httpclient-4
    - konveyor.io/target=httpclient-5
    - konveyor.io/generated-by=ai-rule-gen
  message: The `org.apache.http` package namespace has been replaced in HttpClient 5.x. Remove old `org.apache.http` imports and re-import classes from `org.apache.hc.httpclient5` (for client classes like `HttpClients`, `HttpGet`, `HttpPost`) or `org.apache.hc.core5` (for core classes like `HttpEntity`, `ContentType`). Most class names resolve automatically in the new namespace, but some classes have been renamed.
  links:
    - url: https://hc.apache.org/httpcomponents-client-5.4.x/migration-guide/preparation.html
      title: Migration Documentation
  when:
    java.referenced:
        pattern: org.apache.http
        location: PACKAGE
- ruleID: httpclient-4-to-httpclient-5-00030
  description: SSLConnectionSocketFactory has been replaced by ClientTlsStrategyBuilder in HttpClient 5.x. The new API uses a builder pattern with TLS strategy instead of socket factory for SSL/TLS configuration.
  category: mandatory
  effort: 7
  labels:
    - konveyor.io/source=httpclient-4
    - konveyor.io/target=httpclient-5
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    The `SSLConnectionSocketFactory` class has been replaced by `ClientTlsStrategyBuilder` in HttpClient 5.x. The SSL/TLS configuration model has changed fundamentally.

    Before (4.x):
    ```java
    new SSLConnectionSocketFactory(
        SSLContexts.createSystemDefault(),
        new String[]{"TLSv1.2"}, null,
        SSLConnectionSocketFactory.getDefaultHostnameVerifier())
    ```

    After (5.x):
    ```java
    ClientTlsStrategyBuilder.create()
        .setSslContext(SSLContexts.createSystemDefault())
        .setTlsVersions(TLS.V_1_3)
        .build()
    ```
  links:
    - url: https://hc.apache.org/httpcomponents-client-5.4.x/migration-guide/preparation.html
      title: Migration Documentation
  when:
    java.referenced:
        pattern: org.apache.http.conn.ssl.SSLConnectionSocketFactory
        location: IMPORT
- ruleID: httpclient-4-to-httpclient-5-00040
  description: HttpResponse.getStatusLine() has been removed in HttpClient 5.x. HTTP response messages no longer have a status line object. Use response.getCode() for the status code directly, or new StatusLine(response) if you need the full status line representation.
  category: mandatory
  effort: 5
  labels:
    - konveyor.io/source=httpclient-4
    - konveyor.io/target=httpclient-5
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    The `getStatusLine()` method has been removed from `HttpResponse` in HttpClient 5.x. Use `response.getCode()` to get the HTTP status code directly, or `new StatusLine(response)` if you need the full status line.

    Before (4.x):
    ```java
    if (response.getStatusLine().getStatusCode() >= 300) {
        throw new ClientProtocolException(response.getStatusLine().toString());
    }
    ```

    After (5.x):
    ```java
    if (response.getCode() >= 300) {
        throw new ClientProtocolException(new StatusLine(response).toString());
    }
    ```
  links:
    - url: https://hc.apache.org/httpcomponents-client-5.4.x/migration-guide/preparation.html
      title: Migration Documentation
  when:
    java.referenced:
        pattern: org.apache.http.HttpResponse.getStatusLine
        location: METHOD_CALL
- ruleID: httpclient-4-to-httpclient-5-00050
  description: HttpClientBuilder.setConnectionTimeToLive(long, TimeUnit) has been replaced. In HttpClient 5.x, connection TTL is configured via ConnectionConfig.custom().setTimeToLive(TimeValue) on the connection manager, not directly on the client builder.
  category: mandatory
  effort: 5
  labels:
    - konveyor.io/source=httpclient-4
    - konveyor.io/target=httpclient-5
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    The `HttpClientBuilder.setConnectionTimeToLive(long, TimeUnit)` method has been replaced. In HttpClient 5.x, connection time-to-live is configured through `ConnectionConfig` on the connection manager.

    Before (4.x):
    ```java
    HttpClients.custom()
        .setConnectionTimeToLive(1, TimeUnit.MINUTES)
        .build();
    ```

    After (5.x):
    ```java
    PoolingHttpClientConnectionManagerBuilder.create()
        .setDefaultConnectionConfig(ConnectionConfig.custom()
            .setTimeToLive(TimeValue.ofMinutes(10))
            .build())
        .build();
    ```

    Note: HttpClient 5.0 treats zero TTL as connections not meant to be reused, unlike 4.x where zero meant unlimited.
  links:
    - url: https://hc.apache.org/httpcomponents-client-5.4.x/migration-guide/preparation.html
      title: Migration Documentation
  when:
    java.referenced:
        pattern: org.apache.http.impl.client.HttpClientBuilder.setConnectionTimeToLive
        location: METHOD_CALL
- ruleID: httpclient-4-to-httpclient-5-00060
  description: RequestConfig.setConnectTimeout(int) has been replaced. In HttpClient 5.x, connect timeout is configured via ConnectionConfig.custom().setConnectTimeout(Timeout) on the connection manager, not via RequestConfig. The Timeout class replaces raw integer milliseconds.
  category: mandatory
  effort: 5
  labels:
    - konveyor.io/source=httpclient-4
    - konveyor.io/target=httpclient-5
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    The `setConnectTimeout(int)` method on `RequestConfig` has been replaced. In HttpClient 5.x, connect timeout is configured through `ConnectionConfig` using the `Timeout` class.

    Before (4.x):
    ```java
    RequestConfig.custom()
        .setConnectTimeout(60000)
        .build();
    ```

    After (5.x):
    ```java
    ConnectionConfig.custom()
        .setConnectTimeout(Timeout.ofMinutes(1))
        .build();
    ```

    Note: Connect timeout has moved from `RequestConfig` to `ConnectionConfig` and now uses the `Timeout` class instead of raw milliseconds.
  links:
    - url: https://hc.apache.org/httpcomponents-client-5.4.x/migration-guide/preparation.html
      title: Migration Documentation
  when:
    java.referenced:
        pattern: org.apache.http.client.config.RequestConfig.Builder.setConnectTimeout
        location: METHOD_CALL
