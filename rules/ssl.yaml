- ruleID: httpclient-4-to-httpclient-5-00100
  description: setSSLSocketFactory() replaced by setTlsSocketStrategy() in HttpClient 5.x
  category: mandatory
  effort: 7
  labels:
    - konveyor.io/source=httpclient-4
    - konveyor.io/target=httpclient-5
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    Replace `setSSLSocketFactory()` with `setTlsSocketStrategy()`. In HttpClient 5.x, SSL/TLS is configured via `PoolingHttpClientConnectionManagerBuilder` using `ClientTlsStrategyBuilder`:

    ```java
    // Before
    HttpClients.custom()
        .setSSLSocketFactory(new SSLConnectionSocketFactory(...))

    // After
    PoolingHttpClientConnectionManagerBuilder.create()
        .setTlsSocketStrategy(ClientTlsStrategyBuilder.create()
            .setSslContext(SSLContexts.createSystemDefault())
            .setTlsVersions(TLS.V_1_3)
            .build())
    ```
  links:
    - url: https://hc.apache.org/httpcomponents-client-5.4.x/migration-guide/migration-to-classic.html
      title: Migration Documentation
  when:
    java.referenced:
        pattern: setSSLSocketFactory
        location: METHOD_CALL
- ruleID: httpclient-4-to-httpclient-5-00190
  description: ManagedHttpClientConnection SSL access replaced by HttpCoreContext.getSSLSession()
  category: mandatory
  effort: 5
  labels:
    - konveyor.io/source=httpclient-4
    - konveyor.io/target=httpclient-5
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    Replace the pattern of casting `HttpContext.getAttribute(HttpCoreContext.HTTP_CONNECTION)` to `ManagedHttpClientConnection` and calling `getSSLSession()` with the simpler `HttpCoreContext.getSSLSession()`:

    ```java
    // Before
    ((ManagedHttpClientConnection) context.getAttribute(HttpCoreContext.HTTP_CONNECTION)).getSSLSession()

    // After
    coreContext.getSSLSession()
    ```
  links:
    - url: https://hc.apache.org/httpcomponents-client-5.4.x/migration-guide/migration-to-classic.html
      title: Migration Documentation
  when:
    java.referenced:
        pattern: org.apache.http.conn.ManagedHttpClientConnection
        location: IMPORT
