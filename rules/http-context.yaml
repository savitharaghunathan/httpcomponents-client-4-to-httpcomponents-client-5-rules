- ruleID: httpclient-4-to-httpclient-5-00130
  description: BasicHttpContext renamed to HttpCoreContext in HttpClient 5.x
  category: mandatory
  effort: 3
  labels:
    - konveyor.io/source=httpclient-4
    - konveyor.io/target=httpclient-5
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    Replace `BasicHttpContext` with `HttpCoreContext` or `HttpClientContext`. In HttpClient 5.x, the basic context implementation has been renamed:

    ```java
    // Before
    HttpContext context = new BasicHttpContext();

    // After
    HttpCoreContext context = HttpCoreContext.create();
    // or
    HttpClientContext context = HttpClientContext.create();
    ```
  links:
    - url: https://hc.apache.org/httpcomponents-client-5.4.x/migration-guide/migration-to-classic.html
      title: Migration Documentation
  when:
    java.referenced:
        pattern: org.apache.http.protocol.BasicHttpContext
        location: IMPORT
- ruleID: httpclient-4-to-httpclient-5-00180
  description: HttpCoreContext.HTTP_TARGET_HOST replaced by HttpClientContext.getHttpRoute().getTargetHost()
  category: mandatory
  effort: 5
  labels:
    - konveyor.io/source=httpclient-4
    - konveyor.io/target=httpclient-5
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    Replace `HttpContext.getAttribute(HttpCoreContext.HTTP_TARGET_HOST)` with `HttpClientContext.getHttpRoute().getTargetHost()`. The static constant-based context attribute access pattern has been replaced with a direct method call:

    ```java
    // Before
    HttpHost target = (HttpHost) context.getAttribute(HttpCoreContext.HTTP_TARGET_HOST);

    // After
    HttpHost target = clientContext.getHttpRoute().getTargetHost();
    ```
  links:
    - url: https://hc.apache.org/httpcomponents-client-5.4.x/migration-guide/migration-to-classic.html
      title: Migration Documentation
  when:
    builtin.filecontent:
        pattern: HTTP_TARGET_HOST
        filePattern: .*\.java
