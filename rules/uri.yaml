- ruleID: httpclient-4-to-httpclient-5-00120
  description: RequestConfig.normalizeUri removed; use URIBuilder.optimize() in HttpClient 5.x
  category: mandatory
  effort: 5
  labels:
    - konveyor.io/source=httpclient-4
    - konveyor.io/target=httpclient-5
    - konveyor.io/generated-by=ai-rule-gen
  message: The `normalizeUri` property has been removed from `RequestConfig` in HttpClient 5.x. `URIUtils.normalizeSyntax` is no longer public. Use `URIBuilder.optimize()` (or `URIBuilder.normalizeSyntax()` in 5.0-5.2, deprecated since 5.3) from httpcomponents-core 5.x instead. Note that the 5.x implementation provides more thorough RFC 3986 support, specifically percent-encoding all components.
  links:
    - url: https://hc.apache.org/httpcomponents-client-5.4.x/migration-guide/migration-to-classic.html
      title: Migration Documentation
  when:
    builtin.filecontent:
        pattern: normalizeUri
        filePattern: .*\.java
