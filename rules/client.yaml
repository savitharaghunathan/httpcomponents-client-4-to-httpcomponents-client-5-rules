- ruleID: httpclient4-to-httpclient5-00130
  description: setRetryHandler() replaced by setRetryStrategy() in 5.x
  category: mandatory
  effort: 3
  labels:
    - konveyor.io/source=httpclient4
    - konveyor.io/source=httpcomponents-client
    - konveyor.io/target=httpclient5
    - konveyor.io/target=httpcomponents-client
    - konveyor.io/generated-by=ai-rule-gen
  message: Replace `HttpClients.custom().setRetryHandler(retryHandler)` with `HttpClients.custom().setRetryStrategy(retryStrategy)`. HttpClient 5.x refactored the retry mechanism from a handler pattern to a strategy pattern.
  links:
    - url: https://hc.apache.org/httpcomponents-client-5.6.x/migration-guide/migration-to-classic.html
      title: Migration Documentation
  when:
    java.referenced:
        pattern: setRetryHandler
        location: METHOD_CALL
- ruleID: httpclient4-to-httpclient5-00140
  description: addInterceptorLast() replaced by addExecInterceptorFirst() for logging
  category: mandatory
  effort: 3
  labels:
    - konveyor.io/source=httpclient4
    - konveyor.io/source=httpcomponents-client
    - konveyor.io/target=httpclient5
    - konveyor.io/target=httpcomponents-client
    - konveyor.io/generated-by=ai-rule-gen
  message: Replace `HttpClients.custom().addInterceptorLast(interceptor)` with `HttpClients.custom().addExecInterceptorFirst("name", interceptor)`. In HttpClient 5.x, execution interceptors require a name and should be added first to avoid logging compressed payloads.
  links:
    - url: https://hc.apache.org/httpcomponents-client-5.6.x/migration-guide/migration-to-classic.html
      title: Migration Documentation
  when:
    java.referenced:
        pattern: addInterceptorLast
        location: METHOD_CALL
- ruleID: httpclient4-to-httpclient5-00280
  description: HttpClients moved to new package; configure via builder pattern
  category: mandatory
  effort: 5
  labels:
    - konveyor.io/source=httpclient4
    - konveyor.io/source=httpcomponents-client
    - konveyor.io/target=httpclient5
    - konveyor.io/target=httpcomponents-client
    - konveyor.io/generated-by=ai-rule-gen
  message: 'Replace `org.apache.http.impl.client.HttpClients` with `org.apache.hc.client5.http.impl.classic.HttpClients`. In HttpClient 5.x, configure the client with an explicit connection manager: `HttpClients.custom().setConnectionManager(connectionManager).build()`.'
  links:
    - url: https://hc.apache.org/httpcomponents-client-5.6.x/migration-guide/migration-to-classic.html
      title: Migration Documentation
  when:
    java.referenced:
        pattern: org.apache.http.impl.client.HttpClients
        location: IMPORT
