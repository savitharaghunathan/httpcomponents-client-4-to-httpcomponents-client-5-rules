- ruleID: httpclient4-to-httpclient5-00090
  description: getRequestLine() removed; use new RequestLine(request) instead
  category: mandatory
  effort: 3
  labels:
    - konveyor.io/source=httpclient4
    - konveyor.io/source=httpcomponents-client
    - konveyor.io/target=httpclient5
    - konveyor.io/target=httpcomponents-client
    - konveyor.io/generated-by=ai-rule-gen
  message: Replace `request.getRequestLine()` with `new RequestLine(request)`. HttpClient 5.x removes the `getRequestLine()` method and provides a `RequestLine` constructor instead.
  links:
    - url: https://hc.apache.org/httpcomponents-client-5.6.x/migration-guide/migration-to-classic.html
      title: Migration Documentation
  when:
    java.referenced:
        pattern: getRequestLine
        location: METHOD_CALL
- ruleID: httpclient4-to-httpclient5-00170
  description: HttpPost moved to new package; consider ClassicRequestBuilder
  category: mandatory
  effort: 3
  labels:
    - konveyor.io/source=httpclient4
    - konveyor.io/source=httpcomponents-client
    - konveyor.io/target=httpclient5
    - konveyor.io/target=httpcomponents-client
    - konveyor.io/generated-by=ai-rule-gen
  message: Replace `org.apache.http.client.methods.HttpPost` with `org.apache.hc.client5.http.classic.methods.HttpPost`, or use the builder pattern `ClassicRequestBuilder.post(url).setEntity(...).build()` for a more fluent API.
  links:
    - url: https://hc.apache.org/httpcomponents-client-5.6.x/migration-guide/migration-to-classic.html
      title: Migration Documentation
  when:
    java.referenced:
        pattern: org.apache.http.client.methods.HttpPost
        location: IMPORT
- ruleID: httpclient4-to-httpclient5-00180
  description: HttpGet moved to new package in 5.x
  category: mandatory
  effort: 1
  labels:
    - konveyor.io/source=httpclient4
    - konveyor.io/source=httpcomponents-client
    - konveyor.io/target=httpclient5
    - konveyor.io/target=httpcomponents-client
    - konveyor.io/generated-by=ai-rule-gen
  message: Replace `org.apache.http.client.methods.HttpGet` with `org.apache.hc.client5.http.classic.methods.HttpGet`, or use `ClassicRequestBuilder.get(url).build()` for the builder pattern.
  links:
    - url: https://hc.apache.org/httpcomponents-client-5.6.x/migration-guide/migration-to-classic.html
      title: Migration Documentation
  when:
    java.referenced:
        pattern: org.apache.http.client.methods.HttpGet
        location: IMPORT
- ruleID: httpclient4-to-httpclient5-00190
  description: EntityTemplate replaced by HttpEntities.create() factory in 5.x
  category: mandatory
  effort: 3
  labels:
    - konveyor.io/source=httpclient4
    - konveyor.io/source=httpcomponents-client
    - konveyor.io/target=httpclient5
    - konveyor.io/target=httpcomponents-client
    - konveyor.io/generated-by=ai-rule-gen
  message: Replace `EntityTemplate` with `HttpEntities.create()`. Use the factory method `HttpEntities.create(outputStream -> { ... }, contentType)` instead of creating an `EntityTemplate` instance and setting content type separately.
  links:
    - url: https://hc.apache.org/httpcomponents-client-5.6.x/migration-guide/migration-to-classic.html
      title: Migration Documentation
  when:
    java.referenced:
        pattern: org.apache.http.entity.EntityTemplate
        location: IMPORT
