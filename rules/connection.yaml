- ruleID: httpclient-4-to-httpclient-5-00090
  description: setSoTimeout() now takes Timeout type instead of int milliseconds in HttpClient 5.x
  category: mandatory
  effort: 3
  labels:
    - konveyor.io/source=httpclient-4
    - konveyor.io/target=httpclient-5
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    In HttpClient 5.x, `setSoTimeout()` now takes a `Timeout` object instead of an int. Use `Timeout.ofMinutes(1)` or `Timeout.ofMilliseconds(60000)` instead of raw integers.

    ```java
    // Before (4.x)
    SocketConfig.custom()
        .setSoTimeout(60000)

    // After (5.x)
    SocketConfig.custom()
        .setSoTimeout(Timeout.ofMinutes(1))
    ```
  links:
    - url: https://hc.apache.org/httpcomponents-client-5.4.x/migration-guide/preparation.html
      title: Migration Documentation
  when:
    java.referenced:
        pattern: setSoTimeout
        location: METHOD_CALL
- ruleID: httpclient-4-to-httpclient-5-00140
  description: closeExpiredConnections() renamed to closeExpired() in HttpClient 5.x
  category: mandatory
  effort: 1
  labels:
