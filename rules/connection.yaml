    - konveyor.io/target=httpclient-5
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    Replace `closeExpiredConnections()` with `closeExpired()`. The method moved from `HttpClientConnectionManager` to the `ConnPoolControl` interface:

    ```java
    // Before
    connectionManager.closeExpiredConnections();

    // After
    connectionManager.closeExpired();
    ```
