- ruleID: httpclient4-to-httpclient5-00260
  description: setDefaultSocketConfig() moved from HttpClientBuilder to connection manager builder
  category: mandatory
  effort: 5
  labels:
    - konveyor.io/source=httpclient4
    - konveyor.io/target=httpclient5
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    Move `setDefaultSocketConfig()` from `HttpClients.custom()` to `PoolingHttpClientConnectionManagerBuilder.create()` or `BasicHttpClientConnectionManager.setSocketConfig()`. In HttpClient 5.x, socket configuration is set on the connection manager, not directly on the HttpClient builder.

    ## Before
    ```java
    HttpClients.custom()
        .setDefaultSocketConfig(SocketConfig.custom()
            .setSoTimeout(60000)
            .build())
        .build();
    ```

    ## After
    ```java
    PoolingHttpClientConnectionManager cm = PoolingHttpClientConnectionManagerBuilder.create()
        .setDefaultSocketConfig(SocketConfig.custom()
            .setSoTimeout(Timeout.ofMinutes(1))
            .build())
        .build();
    HttpClients.custom().setConnectionManager(cm).build();
    ```
  links:
    - url: https://hc.apache.org/httpcomponents-client-5.4.x/migration-guide/migration-to-classic.html
      title: Migration Documentation
  when:
    java.referenced:
        pattern: setDefaultSocketConfig
        location: METHOD_CALL
