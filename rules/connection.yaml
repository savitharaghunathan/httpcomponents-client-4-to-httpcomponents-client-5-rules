- ruleID: httpclient-4-to-httpclient-5-00070
  description: setConnectTimeout() moved from RequestConfig to ConnectionConfig and now takes Timeout type
  category: mandatory
  effort: 5
  labels:
    - konveyor.io/source=httpclient-4
    - konveyor.io/target=httpclient-5
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    In HttpClient 5.x, `setConnectTimeout()` has moved from `RequestConfig.Builder` to `ConnectionConfig.Builder` and now takes a `Timeout` object instead of an int. Use `ConnectionConfig.custom().setConnectTimeout(Timeout.ofMinutes(1))` and set the `ConnectionConfig` on your connection manager.

    ```java
    // Before (4.x)
    RequestConfig.custom()
        .setConnectTimeout(60000)

    // After (5.x)
    ConnectionConfig.custom()
        .setConnectTimeout(Timeout.ofMinutes(1))
    ```
  links:
    - url: https://hc.apache.org/httpcomponents-client-5.4.x/migration-guide/preparation.html
      title: Migration Documentation
  when:
    java.referenced:
        pattern: setConnectTimeout
        location: METHOD_CALL
