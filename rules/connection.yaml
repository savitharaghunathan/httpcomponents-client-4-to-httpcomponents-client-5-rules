    - konveyor.io/target=httpclient-5
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    Replace `closeIdleConnections()` with `closeIdle()`. The method moved from `HttpClientConnectionManager` to the `ConnPoolControl` interface:

    ```java
