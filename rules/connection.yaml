- ruleID: httpclient-4-to-httpclient-5-00240
  description: PoolingHttpClientConnectionManager replaced by PoolingAsyncClientConnectionManager for async APIs
  category: mandatory
  effort: 7
  labels:
    - konveyor.io/source=httpclient-4
    - konveyor.io/target=httpclient-5
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    For async migration, replace `PoolingHttpClientConnectionManager` with `PoolingAsyncClientConnectionManager`. Use `PoolingAsyncClientConnectionManagerBuilder` to create it:

    ```java
    // Before
    PoolingHttpClientConnectionManager cm = new PoolingHttpClientConnectionManager();

    // After
    PoolingAsyncClientConnectionManager cm = PoolingAsyncClientConnectionManagerBuilder.create()
        .setTlsStrategy(ClientTlsStrategyBuilder.create()
            .setSslContext(SSLContexts.createSystemDefault())
            .setTlsVersions(TLS.V_1_3)
            .build())
        .build();
    ```

    Note: `PoolingAsyncClientConnectionManager` uses different TLS/SSL configuration and does not support `SocketConfig` due to differences in the I/O model.
  links:
    - url: https://hc.apache.org/httpcomponents-client-5.4.x/migration-guide/migration-to-async-simple.html
      title: Migration Documentation
  when:
    java.referenced:
        pattern: org.apache.http.impl.conn.PoolingHttpClientConnectionManager
        location: IMPORT
- ruleID: httpclient-4-to-httpclient-5-00260
  description: setDefaultSocketConfig() moved from HttpClients.custom() to PoolingHttpClientConnectionManagerBuilder
  category: mandatory
  effort: 5
  labels:
    - konveyor.io/source=httpclient-4
    - konveyor.io/target=httpclient-5
    - konveyor.io/generated-by=ai-rule-gen
  message: |-
    Replace `HttpClients.custom().setDefaultSocketConfig(...)` with `PoolingHttpClientConnectionManagerBuilder.create().setDefaultSocketConfig(...)` or `BasicHttpClientConnectionManager.setSocketConfig(...)`. Socket configuration is now set on the connection manager, not the client builder:

    ```java
    // Before
    HttpClients.custom()
        .setDefaultSocketConfig(SocketConfig.custom()
            .setSoTimeout(60000)
            .build())

    // After
    PoolingHttpClientConnectionManagerBuilder.create()
        .setDefaultSocketConfig(SocketConfig.custom()
            .setSoTimeout(Timeout.ofMinutes(1))
            .build())
    ```
  links:
    - url: https://hc.apache.org/httpcomponents-client-5.4.x/migration-guide/migration-to-classic.html
      title: Migration Documentation
  when:
    java.referenced:
        pattern: setDefaultSocketConfig
        location: METHOD_CALL
